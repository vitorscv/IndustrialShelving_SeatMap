services:
  postgres:
    image: postgres:16-alpine
    container_name: pallet-checkin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pallet_checkin
      POSTGRES_PASSWORD: pallet_checkin
      POSTGRES_DB: pallet_checkin
    ports:
      - "5432:5432"
    volumes:
      - pallet_checkin_pgdata:/var/lib/postgresql/data

volumes:
  pallet_checkin_pgdata:
